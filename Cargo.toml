[package]
name = "karat67"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Integrity checks for Solana indexers: verify indexed data is correct, not just flowing."
license = "MIT"
authors = ["Huu Le"]
repository = "https://github.com/SGDlab67/karat67"
keywords = ["solana", "indexer", "data-quality", "integrity"]
categories = ["development-tools", "data-structures"]

[features]
default = ["rpc"]
# The blocking HTTP fetcher. Off for wasm32, which has no sockets: the browser
# does the fetch and hands the bytes to `wasm::check_account_json`.
rpc = ["dep:ureq"]
# wasm-bindgen exports for the in-browser gate. Build with:
#   wasm-pack build --target web --no-default-features --features wasm
wasm = ["dep:wasm-bindgen"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking, rustls-based HTTP client for the real getMultipleAccounts path.
# rustls avoids OpenSSL/libssl-dev system deps, keeping CI toolchain-only.
ureq = { version = "3", features = ["json"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[lib]
# cdylib for wasm-pack; rlib keeps the crate usable as a normal dependency.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "karat"
path = "src/bin/karat.rs"
required-features = ["rpc"]

[[bin]]
name = "karat-mcp"
path = "src/bin/karat-mcp.rs"
required-features = ["rpc"]
